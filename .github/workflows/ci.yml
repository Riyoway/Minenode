name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/Minenode.Desktop/Minenode.Desktop.csproj
      - name: Build desktop
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/Minenode.Desktop/Minenode.Desktop.csproj --configuration Release --no-restore 2>&1 | tee desktop-build.log
      - name: Upload desktop build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-log
          path: desktop-build.log
          if-no-files-found: ignore

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix runtime --ignore-scripts
      - run: node --check runtime/index.mjs
