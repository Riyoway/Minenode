name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/Minenode.Desktop/Minenode.Desktop.csproj
      - run: dotnet build src/Minenode.Desktop/Minenode.Desktop.csproj --configuration Release --no-restore

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix runtime --ignore-scripts
      - run: node --check runtime/index.mjs
